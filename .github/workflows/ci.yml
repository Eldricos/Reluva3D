# Builds Reluva and runs its tests on Linux, macOS and Windows, and checks
# the 3D renderer (src/devtools/render_check.cpp) against the reference frames
# in tests/render: on macOS through Metal, on Linux through Vulkan on
# Mesa's software driver (lavapipe). Windows' runners have no Vulkan driver,
# so there it's built and tested only.
#
# The frames drawn, and where they differ from the references, are kept as
# each run's artifacts. After a change that's meant to alter them, make new
# references with `reluva-render-check tests/render --update` and
# commit them.
#
# The "engine alone" jobs build each engine with every other one disabled
# (engines.cfg), so no engine comes to rely on another's code, and any
# engine can be left out for the rest to build. The engines are read from
# engines.cfg, so a new engine is built alone once it has its line there.
#
# The "new engine from the template" job makes an engine with
# cmake/NewEngine.cmake and builds and tests it, so the template keeps up
# with the code it uses (src/engines/engine.h, the tests' and tools'
# frameworks).
#
# The "style" job checks the code against docs/CODING_GUIDE.md:
# formatting (tools/format.py, clang-format 18) on every file, and
# clang-tidy 18 (tools/tidy.py) on the files the push or pull request
# changes. For now it only reports (docs/code-style-migration.md): its
# steps may fail without failing the run, and the counts are in the run's
# summary.
#
# The "docs" job checks the documentation against
# docs/DOCUMENTATION_STANDARD.md: tools/check-docs.py (links, each engine's
# pages, status lines, names) and markdownlint (headings; its rules are in
# .markdownlint-cli2.jsonc).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Vulkan, lavapipe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev libudev-dev libwayland-dev \
            mesa-vulkan-drivers xvfb
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: Render check
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: x11
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ./build/reluva-render-check tests/render --out render-out
      - name: Frames drawn
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-linux
          path: render-out
          if-no-files-found: ignore

  macos:
    name: macOS (Metal)
    # Off for now: no macOS runner is given to this repository's jobs
    # (they're cancelled before one starts). Remove this line to run it.
    if: false
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Packages
        run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: Render check
        env:
          SDL_AUDIODRIVER: dummy
        run: ./build/reluva-render-check tests/render --out render-out
      - name: Frames drawn
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-macos
          path: render-out
          if-no-files-found: ignore

  windows:
    name: Windows (build and tests)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

  engines:
    name: Engine list
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - name: Engines in engines.cfg
        id: list
        # Every engine named in engines.cfg, enabled or not, and the
        # testbed. An engine folder with no line there fails the job: the
        # build would leave it out without a word.
        run: |
          names=$(sed -nE 's/^([A-Za-z0-9_]+)=.*/\1/p' engines.cfg)
          missing=0
          for dir in src/engines/*/; do
            engine=$(basename "$dir")
            if [ "$engine" != testbed ] && ! printf '%s\n' $names | grep -qx "$engine"; then
              echo "::error file=engines.cfg::src/engines/$engine has no line in engines.cfg (add $engine=enabled)"
              missing=1
            fi
          done
          list=$(printf '%s\n' $names testbed | jq -R . | jq -cs .)
          echo "Engines: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"
          exit $missing

  engine-alone:
    name: Engine alone (${{ matrix.engine }})
    needs: engines
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.engines.outputs.list) }}
    steps:
      - uses: actions/checkout@v7
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev libudev-dev libwayland-dev
      - name: Engine list
        # Every engine in engines.cfg disabled but this one (the testbed is
        # always built).
        run: |
          sed -E 's/^([A-Za-z0-9_]+)=.*/\1=disabled/' engines.cfg > engines-ci.cfg
          if [ "${{ matrix.engine }}" != testbed ]; then
            sed -i -E 's/^${{ matrix.engine }}=disabled$/${{ matrix.engine }}=enabled/' engines-ci.cfg
          fi
          cat engines-ci.cfg
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRELUVA_ENGINES_FILE=$PWD/engines-ci.cfg
      - name: Build
        run: cmake --build build
      - name: Tests
        run: ctest --test-dir build --output-on-failure

  template:
    name: New engine from the template
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev libudev-dev libwayland-dev
      - name: Make an engine
        # As docs/ADDING_AN_ENGINE.md says to; a name with "_" checks the
        # names made from it (TemplateCheck, templateCheckMetaEngine).
        run: cmake -DENGINE=template_check -DTITLE="Template Check" -P cmake/NewEngine.cmake
      - name: Engine list
        # It alone (and the testbed), as a new engine is built at first.
        run: |
          sed -E 's/^([A-Za-z0-9_]+)=.*/\1=disabled/' engines.cfg > engines-ci.cfg
          sed -i -E 's/^template_check=disabled$/template_check=enabled/' engines-ci.cfg
          cat engines-ci.cfg
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRELUVA_ENGINES_FILE=$PWD/engines-ci.cfg
      - name: Build
        # Warnings fail it: a new engine should start clean.
        run: |
          cmake --build build 2>&1 | tee build.log
          if grep -E "src/engines/template_check|tests/engines/template_check" build.log | grep -q "warning:"; then
            echo "::error::the template's code builds with warnings"
            exit 1
          fi
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: Its reluva-tool command
        run: |
          ./build/reluva-tool help template_check
          ./build/reluva-tool template_check files tests/engines/template_check

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Links, pages and names
        run: python3 tools/check-docs.py
      - name: Markdown
        run: npx --yes markdownlint-cli2@0.23.3

  style:
    name: Code style (report only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # All history: clang-tidy checks what changed since the base.
          fetch-depth: 0
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-format-18 clang-tidy-18
      - name: Formatting
        # Report only until the code is formatted (Phase 2 of the plan).
        continue-on-error: true
        run: python3 tools/format.py --check | tee format.txt
      - name: clang-tidy (changed files)
        continue-on-error: true
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          # A new branch's first push has no "before": compare with main.
          if ! git rev-parse -q --verify "$BASE^{commit}" > /dev/null; then BASE=origin/main; fi
          # Only a configure for the compile database: SDL without a
          # window system needs none of its packages.
          python3 tools/tidy.py --changed "$BASE" --cmake -G Ninja \
            -DSDL_UNIX_CONSOLE_BUILD=ON -DSDL_X11=OFF -DSDL_WAYLAND=OFF | tee tidy.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "### Formatting (tools/format.py)"
            tail -n 1 format.txt 2> /dev/null || echo "not run"
            echo "### clang-tidy on the changed files (tools/tidy.py)"
            echo '```'
            grep -E '^ *[0-9]+  [a-z]|findings|No C\+\+ files' tidy.txt 2> /dev/null || echo "not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
