# Which engines Reluva builds: one per line, <engine>=enabled or <engine>=disabled.
#
# To leave an engine out (one that doesn't build, say), set it to disabled;
# set it back to enabled to build it again. Each name is the engine's folder
# in src/engines/. The next build reconfigures by itself.
#
# For a change on your machine only, put the lines to change in
# engines.local.cfg beside this file (git ignores it): its lines win.
# The testbed (src/engines/testbed) is always built.

idtech3=enabled

# Two of its files hold string literals longer than Visual Studio accepts;
# with GCC or Clang it builds.
newworlds=disabled
